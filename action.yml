name: Flutter Release Doctor
description: >
  Audit a Flutter Android/iOS project for release-readiness and fail the job
  according to the selected fail-on policy.
author: Flutter Release Doctor

branding:
  icon: activity
  color: blue

inputs:
  project-path:
    description: Absolute or workspace-relative path to the Flutter project to audit.
    required: false
    default: ${{ github.workspace }}
  fail-on:
    description: Exit policy forwarded to the CLI — error, warning, or never.
    required: false
    default: error
  format:
    description: Human-facing report format — console, markdown, or json.
    required: false
    default: console
  report-path:
    description: Optional path to write the selected format report file.
    required: false
    default: ''
  no-markdown-report:
    description: When true, skip creating release-doctor-report.md in the project.
    required: false
    default: 'false'

outputs:
  score:
    description: Release score from 0 to 100.
    value: ${{ steps.doctor.outputs.score }}
  errors:
    description: Number of ERROR findings.
    value: ${{ steps.doctor.outputs.errors }}
  warnings:
    description: Number of WARNING findings.
    value: ${{ steps.doctor.outputs.warnings }}
  report-path:
    description: Path to the generated report file (JSON used for metrics, or the path from report-path).
    value: ${{ steps.doctor.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - name: Install Release Doctor dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: dart pub get

    - name: Run Flutter Release Doctor
      id: doctor
      shell: bash
      env:
        INPUT_PROJECT_PATH: ${{ inputs.project-path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        INPUT_NO_MARKDOWN_REPORT: ${{ inputs.no-markdown-report }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        PROJECT_PATH="${INPUT_PROJECT_PATH}"
        FAIL_ON="${INPUT_FAIL_ON}"
        FORMAT="${INPUT_FORMAT}"
        REPORT_PATH="${INPUT_REPORT_PATH}"
        NO_MARKDOWN_REPORT="${INPUT_NO_MARKDOWN_REPORT}"

        # Resolve relative paths against the consumer workspace.
        if [[ "${PROJECT_PATH}" != /* ]]; then
          PROJECT_PATH="${GITHUB_WORKSPACE}/${PROJECT_PATH}"
        fi
        if [[ -n "${REPORT_PATH}" && "${REPORT_PATH}" != /* ]]; then
          REPORT_PATH="${GITHUB_WORKSPACE}/${REPORT_PATH}"
        fi

        case "${FAIL_ON}" in
          error|warning|never) ;;
          *)
            echo "Invalid fail-on value: ${FAIL_ON} (expected error|warning|never)" >&2
            exit 64
            ;;
        esac

        case "${FORMAT}" in
          console|markdown|json) ;;
          *)
            echo "Invalid format value: ${FORMAT} (expected console|markdown|json)" >&2
            exit 64
            ;;
        esac

        INTERNAL_JSON="${RUNNER_TEMP}/release-doctor-internal.json"
        if [[ "${FORMAT}" == "json" && -n "${REPORT_PATH}" ]]; then
          INTERNAL_JSON="${REPORT_PATH}"
        fi

        mkdir -p "$(dirname "${INTERNAL_JSON}")"

        JSON_ARGS=(
          check
          "${PROJECT_PATH}"
          --format
          json
          --output
          "${INTERNAL_JSON}"
          --fail-on
          "${FAIL_ON}"
        )
        if [[ "${NO_MARKDOWN_REPORT}" == "true" ]]; then
          JSON_ARGS+=(--no-markdown-report)
        fi

        set +e
        dart run "${ACTION_PATH}/bin/flutter_release_doctor.dart" "${JSON_ARGS[@]}"
        DOCTOR_EXIT=$?
        set -e

        if [[ ! -f "${INTERNAL_JSON}" ]]; then
          echo "Release Doctor did not produce a JSON report at ${INTERNAL_JSON}" >&2
          exit "${DOCTOR_EXIT}"
        fi

        # Optional user-facing format (console/markdown) or JSON report path.
        if [[ "${FORMAT}" != "json" ]]; then
          DISPLAY_ARGS=(
            check
            "${PROJECT_PATH}"
            --format
            "${FORMAT}"
            --fail-on
            never
          )
          if [[ "${NO_MARKDOWN_REPORT}" == "true" ]]; then
            DISPLAY_ARGS+=(--no-markdown-report)
          fi
          if [[ -n "${REPORT_PATH}" ]]; then
            mkdir -p "$(dirname "${REPORT_PATH}")"
            DISPLAY_ARGS+=(--output "${REPORT_PATH}")
          fi
          dart run "${ACTION_PATH}/bin/flutter_release_doctor.dart" "${DISPLAY_ARGS[@]}" || true
          OUTPUT_REPORT_PATH="${REPORT_PATH:-${INTERNAL_JSON}}"
        else
          if [[ -n "${REPORT_PATH}" && "${REPORT_PATH}" != "${INTERNAL_JSON}" ]]; then
            mkdir -p "$(dirname "${REPORT_PATH}")"
            cp "${INTERNAL_JSON}" "${REPORT_PATH}"
            OUTPUT_REPORT_PATH="${REPORT_PATH}"
          else
            OUTPUT_REPORT_PATH="${INTERNAL_JSON}"
          fi
        fi

        python3 - "${INTERNAL_JSON}" "${OUTPUT_REPORT_PATH}" <<'PY'
        import json
        import os
        import sys

        json_path, report_path = sys.argv[1], sys.argv[2]
        with open(json_path, encoding="utf-8") as handle:
            data = json.load(handle)

        summary = data.get("summary") or {}
        score = data.get("score", "")
        errors = summary.get("error", 0)
        warnings = summary.get("warning", 0)

        output_file = os.environ["GITHUB_OUTPUT"]
        with open(output_file, "a", encoding="utf-8") as out:
            out.write(f"score={score}\n")
            out.write(f"errors={errors}\n")
            out.write(f"warnings={warnings}\n")
            out.write(f"report-path={report_path}\n")
        PY

        exit "${DOCTOR_EXIT}"
